# Weekly dependency update pull requests. Minor/patch updates arrive grouped
# in one PR; major versions (which can need code changes) arrive separately.
# Security updates are opened as soon as an advisory is published, if
# "Dependabot security updates" is enabled in the repo's Settings -> Code
# security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

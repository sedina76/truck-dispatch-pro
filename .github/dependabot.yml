# Weekly dependency update pull requests -- minor and patch updates only,
# grouped into ONE pull request per week. Major versions (e.g. TypeScript 5
# -> 7, Next 15 -> 16) can need code changes, so Dependabot does not propose
# them automatically; they are upgraded deliberately, one at a time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
